<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>My First Website</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        text-align: center;
        padding: 50px;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        max-width: 500px;
        margin: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
        color: #007bff;
    }

    button {
        background: #007bff;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }
</style>


</head>

<body>

<div class="container">
    <h1>Welcome to My Website!</h1>
    <p>This is my first HTML website.</p>

    <button onclick="showMessage()">Click Me</button>
</div>

<script>
    function showMessage() {
        alert("Hello! Welcome to my website.");
    }
</script>


</body> </html>
